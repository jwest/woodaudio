[package]
name = "woodaudio-player"
version = "0.5.0"
edition = "2021"

[features]
default = []
gpio = ["dep:rppal"]
gui = ["dep:slint", "dep:slint-build", "dep:qrcode"]

[dependencies]
reqwest = { version = "0.12.5", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
ringbuf = "0.3"
symphonia = { version = "0.5", features = ["flac", "mp3", "aac", "pcm", "isomp4"] }
libc = "0.2"
metaflac = "0.2.7"
rand = "0.8.5"
crossbeam-channel = "0.5.8"
log = "0.4.0"
env_logger = "0.11.5"
rust-ini = "0.21.0"
home = "0.5.5"
bytes = "1"
tiny_http = "0.12.0"
image = "0.25"
qrcode = { version = "0.14.1", optional = true }
tempfile = "3.10.1"
thread-priority = "1.1.0"
suppaftp = "6.0.1"
secular = { version= "1.0.1", features=["bmp","normalization"] }
slint = { version = "1.12.1", features = ["backend-linuxkms-noseat"], optional = true }
rppal = { version = "0.22.1", optional = true }

[build-dependencies]
slint-build = { version = "1.12.1", optional = true }