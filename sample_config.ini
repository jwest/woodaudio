[Tidal]
token_type=Bearer
access_token=
refresh_token=

[GUI]
enabled=true
systray_enabled=false
display_cover_background=true
display_cover_foreground=true

[Exporter_smb]
enabled=false
server=
share=
password=
username=
workgroup=
cache=false

[OnSave]
; Commands executed via sh -c after each config save (e.g. after Tidal token refresh)
cmd_1=touch /tmp/woodaudio_config_saved

[OnTrackChange]
; Commands executed when a new track starts playing
; cmd_1=touch /tmp/woodaudio_track_changed

[OnLike]
; Commands executed when a track is liked
; cmd_1=touch /tmp/woodaudio_track_liked